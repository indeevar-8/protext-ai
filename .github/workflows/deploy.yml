name: Deploy ProText AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prepare offline MediaPipe assets
        run: |
          mkdir -p public/mediapipe/wasm public/models
          cp node_modules/@mediapipe/tasks-vision/wasm/* public/mediapipe/wasm/
          curl -fL --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite" \
            -o public/models/blaze_face_short_range.tflite

      - name: Build ProText AI
        run: npm run build

      - name: Verify face detection assets
        run: |
          test -s dist/models/blaze_face_short_range.tflite
          test -s dist/mediapipe/wasm/vision_wasm_internal.wasm
          echo "Offline face detection assets verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4